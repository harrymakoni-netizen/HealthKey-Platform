name: Verify HealthKey
on: [push, pull_request]
permissions:
  contents: read
jobs:
  synthetic-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE: bundled
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/local.mjs
      - run: npm run db:setup
      - run: npm run typecheck && npm run lint && npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start synthetic services
        run: |
          node --env-file=.env.local --import tsx scripts/cleanup.ts --watch > /tmp/healthkey-cleanup.log 2>&1 &
          npm start > /tmp/healthkey-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health >/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm test
      - run: npm run test:e2e
      # No env files, authentication traces or database dumps are uploaded.
